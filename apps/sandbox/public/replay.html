<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Session replay</title>
<style>
  :root { --bg:#0a0a0a; --line:#262626; --ink:#f5f5f5; --mute:#a3a3a3; --dim:#737373; --ok:#34d399; --bad:#fb7185; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:var(--ink); }
  .mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color:var(--mute); }
  .app { display:grid; grid-template-rows:auto 1fr; height:100vh; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  .stats { display:flex; flex-wrap:wrap; gap:20px; margin-top:8px; }
  .stats div b { display:block; font-size:20px; }
  .stats div span { color:var(--dim); font-size:12px; }
  .cols { display:grid; grid-template-columns:420px 1fr; min-height:0; }
  .col { min-height:0; overflow:auto; }
  .col:first-child { border-right:1px solid var(--line); }
  .ev { display:block; width:100%; text-align:left; background:transparent; color:inherit; border:0; border-bottom:1px solid #1a1a1a; padding:8px 14px; cursor:pointer; font:inherit; }
  .ev:hover, .ev.on { background:#161616; }
  .ev .k { font:11px ui-monospace, Menlo, monospace; color:var(--dim); }
  .ev .t { white-space:pre-wrap; word-break:break-word; margin-top:2px; max-height:4.4em; overflow:hidden; }
  .ev.prompt { border-left:2px solid var(--ink); }
  .ev.prompt .t { font-weight:600; }
  .ev.checkpoint .k { color:var(--ok); }
  .detail { padding:16px 20px; }
  .detail h2 { font-size:16px; margin:0 0 8px; }
  pre { white-space:pre-wrap; word-break:break-word; background:#000; border:1px solid var(--line); border-radius:8px; padding:12px; font:12.5px/1.5 ui-monospace, Menlo, monospace; margin:0 0 16px; }
  .add { color:var(--ok); } .del { color:var(--bad); } .hunk { color:var(--dim); }
  .files { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .files button { background:transparent; color:var(--mute); border:1px solid var(--line); border-radius:6px; padding:3px 8px; font:12px ui-monospace, Menlo, monospace; cursor:pointer; }
  .files button:hover { color:var(--ink); }
</style>
</head>
<body>
<div class="app" id="root"><header><h1>Loading...</h1></header></div>
<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild }
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const api = (u) => fetch(u).then((r) => r.json())
const id = new URLSearchParams(location.search).get("id")
const str = (v) => typeof v === "string" ? v : v?.head ?? JSON.stringify(v ?? "", null, 2)

function colourDiff(text) {
  return esc(text).split("\n").map((l) =>
    l.startsWith("+") && !l.startsWith("+++") ? `<span class="add">${l}</span>`
    : l.startsWith("-") && !l.startsWith("---") ? `<span class="del">${l}</span>`
    : l.startsWith("@@") ? `<span class="hunk">${l}</span>` : l).join("\n")
}

const LABEL = {
  "prompt": "Prompt", "turn.end": "Claude answered", "tool.start": "Tool", "checkpoint": "Checkpoint",
  "human.edit": "Candidate edit", "human.command": "Candidate command", "claude.started": "Claude Code started",
  "session.started": "Session started", "session.resumed": "Session resumed", "error": "Error",
}

function summary(e) {
  const i = e.input ?? {}
  switch (e.type) {
    case "prompt": return str(e.text)
    case "turn.end": return str(e.text) || "(tool calls only)"
    case "tool.start": return `${e.tool}: ${typeof i === "object" ? (i.command ?? i.file_path ?? i.pattern ?? i.path ?? JSON.stringify(i).slice(0, 140)) : i}`
    case "checkpoint": return `${e.sha.slice(0, 7)} ${e.message}`
    case "human.edit": return e.path
    case "human.command": return str(e.command)
    case "error": return `${e.where}: ${e.message}`
    default: return ""
  }
}

async function main() {
  const [meta, events, commits] = await Promise.all([api(`/api/sessions/${id}`), api(`/api/sessions/${id}/events`), api(`/api/sessions/${id}/commits`)])
  if (meta.error) { document.querySelector("h1").textContent = meta.error; return }
  const shown = events.filter((e) => e.type !== "tool.end" && e.type !== "hook")
  const ends = new Map(events.filter((e) => e.type === "tool.end").map((e) => [e.id, e]))
  const count = (t) => events.filter((e) => e.type === t).length
  const first = events[0] ? new Date(events[0].ts) : null
  const last = events.length ? new Date(events[events.length - 1].ts) : null
  const mins = first && last ? Math.round((last - first) / 60000) : 0
  const testRuns = events.filter((e) => (e.type === "tool.start" && /\b(npm|node)\b.*\btest\b/.test(e.input?.command ?? "")) || (e.type === "human.command" && /\btest\b/.test(str(e.command)))).length

  const root = document.getElementById("root")
  root.replaceChildren(
    $(`<header>
      <h1>Session <span class="mono">${esc(id)}</span> <span class="muted" style="font-weight:400">${esc(meta.status)} · started ${new Date(meta.createdAt).toLocaleString()}</span></h1>
      <div class="stats">
        <div><b>${count("prompt")}</b><span>prompts</span></div>
        <div><b>${count("tool.start")}</b><span>Claude tool calls</span></div>
        <div><b>${count("human.edit")}</b><span>edits by hand</span></div>
        <div><b>${count("human.command")}</b><span>commands typed</span></div>
        <div><b>${testRuns}</b><span>test runs</span></div>
        <div><b>${commits.length}</b><span>checkpoints</span></div>
        <div><b>${mins} min</b><span>first to last event</span></div>
      </div>
      <p class="muted" style="margin:8px 0 0">Read from the stored repo and events only; the container ${meta.status === "running" ? "is still running" : "is gone"}. <a href="/">All sessions</a></p>
    </header>`),
    $(`<div class="cols"><div class="col" id="list"></div><div class="col"><div class="detail" id="detail"><p class="muted">Pick an event. Checkpoints show the code as it was.</p></div></div></div>`),
  )

  const list = document.getElementById("list")
  const detail = document.getElementById("detail")
  for (const e of shown) {
    const b = $(`<button class="ev ${e.type}"><div class="k">#${e.seq} · ${new Date(e.ts).toLocaleTimeString()} · ${esc(LABEL[e.type] ?? e.type)}</div><div class="t">${esc(summary(e))}</div></button>`)
    b.onclick = () => { list.querySelectorAll(".on").forEach((x) => x.classList.remove("on")); b.classList.add("on"); show(e) }
    list.append(b)
  }

  async function show(e) {
    if (e.type === "checkpoint") {
      const [{ text }, files] = await Promise.all([api(`/api/sessions/${id}/commits/${e.sha}`), api(`/api/sessions/${id}/tree/${e.sha}`)])
      detail.replaceChildren($(`<div><h2>Checkpoint <span class="mono">${e.sha.slice(0, 7)}</span>: ${esc(e.message)}</h2>
        <p class="muted">The files at this checkpoint (from the stored repo):</p>
        <div class="files">${files.map((f) => `<button data-f="${esc(f)}">${esc(f)}</button>`).join("")}</div>
        <div id="file"></div><p class="muted">What changed:</p><pre>${colourDiff(text)}</pre></div>`))
      detail.querySelectorAll("[data-f]").forEach((btn) => btn.onclick = async () => {
        const { content } = await api(`/api/sessions/${id}/file/${e.sha}?path=${encodeURIComponent(btn.dataset.f)}`)
        detail.querySelector("#file").replaceChildren($(`<pre><b>${esc(btn.dataset.f)}</b>\n\n${esc(content)}</pre>`))
      })
      return
    }
    if (e.type === "tool.start") {
      const end = ends.get(e.id)
      detail.replaceChildren($(`<div><h2>Claude used ${esc(e.tool)}</h2><p class="muted">Input</p><pre>${esc(str(e.input))}</pre>
        ${end ? `<p class="muted">Result${end.ms != null ? ` (${end.ms} ms)` : ""}</p><pre>${esc(str(end.response))}</pre>` : `<p class="muted">No result recorded (refused, failed, or still running).</p>`}</div>`))
      return
    }
    if (e.type === "human.edit") {
      detail.replaceChildren($(`<div><h2>Edited by hand: <span class="mono">${esc(e.path)}</span></h2><pre>${colourDiff(str(e.diff))}</pre></div>`))
      return
    }
    detail.replaceChildren($(`<div><h2>${esc(LABEL[e.type] ?? e.type)}</h2><pre>${esc(summary(e) || JSON.stringify(e, null, 2))}</pre></div>`))
  }
}
main()
</script>
</body>
</html>
