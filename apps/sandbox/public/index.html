<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI build sandbox</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
<style>
  :root { --bg:#0a0a0a; --panel:#111; --line:#262626; --ink:#f5f5f5; --mute:#a3a3a3; --dim:#737373; --ok:#34d399; --bad:#fb7185; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; padding:6px 12px; }
  button:hover { background:#1a1a1a; }
  button.primary { background:var(--ink); color:#0a0a0a; border-color:var(--ink); }
  button.primary:hover { background:#d4d4d4; }
  a { color:var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color:var(--mute); }
  /* list page */
  .list { max-width:760px; margin:64px auto; padding:0 16px; }
  .list h1 { font-size:28px; letter-spacing:-0.02em; margin:0 0 6px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .row .grow { flex:1; min-width:0; }
  /* workspace */
  .app { display:grid; grid-template-rows:48px 1fr; height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:0 12px; border-bottom:1px solid var(--line); }
  header .title { font-weight:600; }
  header .grow { flex:1; }
  .cols { display:grid; grid-template-columns:220px 1fr 420px; min-height:0; }
  .col { min-height:0; overflow:auto; border-right:1px solid var(--line); }
  .col:last-child { border-right:0; display:grid; grid-template-rows:40px 1fr; }
  .files { padding:8px 0; }
  .files .f { display:block; width:100%; text-align:left; border:0; border-radius:0; padding:4px 12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .files .f:hover, .files .f.on { background:#1a1a1a; color:var(--ink); }
  .files .d { padding:6px 12px 2px; color:var(--dim); font-size:12px; }
  #term { height:100%; padding:6px; background:#000; }
  .tabs { display:flex; gap:4px; padding:6px; border-bottom:1px solid var(--line); }
  .tabs button { padding:4px 10px; border-color:transparent; color:var(--mute); }
  .tabs button.on { border-color:var(--line); color:var(--ink); background:#1a1a1a; }
  .pane { min-height:0; overflow:auto; }
  .editor { display:grid; grid-template-rows:auto 1fr; height:100%; }
  .editor .bar { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid var(--line); }
  .editor textarea { width:100%; height:100%; resize:none; border:0; outline:0; background:var(--bg); color:var(--ink); padding:10px; font:13px/1.5 ui-monospace, Menlo, monospace; }
  .ev { padding:8px 12px; border-bottom:1px solid #1a1a1a; }
  .ev .k { font:11px ui-monospace, Menlo, monospace; color:var(--dim); }
  .ev .t { white-space:pre-wrap; word-break:break-word; margin-top:2px; }
  .ev.prompt .t { color:var(--ink); font-weight:600; }
  .ev.checkpoint .k { color:var(--ok); }
  .ev.error .k { color:var(--bad); }
  .empty { padding:24px; color:var(--dim); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild }
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const api = (u, o) => fetch(u, o).then((r) => r.json())
const id = new URLSearchParams(location.search).get("id")
const root = document.getElementById("root")

/** One line per event, in words a reviewer reads (shared shape with the replay). */
function describe(e) {
  const str = (v) => typeof v === "string" ? v : v?.head ?? JSON.stringify(v ?? "")
  switch (e.type) {
    case "prompt": return ["You asked Claude", str(e.text)]
    case "turn.end": return ["Claude answered", str(e.text) || "(no text, only tool calls)"]
    case "tool.start": return [`Claude uses ${e.tool}`, toolLine(e)]
    case "tool.end": return null
    case "checkpoint": return [`Checkpoint ${e.sha.slice(0, 7)}`, `${e.message}\n${e.stat}`]
    case "human.edit": return [`You edited ${e.path}`, ""]
    case "human.command": return ["You ran", str(e.command)]
    case "claude.started": return ["Claude Code started", e.source ?? ""]
    case "session.started": return ["Session started", "Starter repo checked out"]
    case "session.resumed": return ["Session resumed", "Code restored from the stored repo"]
    case "error": return [`Error in ${e.where}`, e.message]
    default: return [e.type, ""]
  }
}
function toolLine(e) {
  const i = e.input ?? {}
  if (typeof i !== "object") return String(i)
  return i.command ?? i.file_path ?? i.pattern ?? i.path ?? i.url ?? JSON.stringify(i).slice(0, 160)
}

async function listPage() {
  const sessions = await api("/api/sessions")
  const el = $(`<div class="list">
    <h1>AI build sandbox</h1>
    <p class="muted">An experiment (plan/ai-build): a container per session with Claude Code, a git repo, and a recording.</p>
    <p><button class="primary" id="new">Start a session</button> <span id="msg" class="muted"></span></p>
    <div id="rows"></div>
  </div>`)
  root.replaceChildren(el)
  const rows = el.querySelector("#rows")
  if (!sessions.length) rows.append($(`<p class="muted">No sessions yet.</p>`))
  for (const s of sessions) {
    rows.append($(`<div class="row"><div class="grow"><span class="mono">${s.id}</span> <span class="muted">${new Date(s.createdAt).toLocaleString()} · ${s.status}</span></div>
      ${s.status === "running" ? `<a href="/?id=${s.id}">Open</a>` : ""} <a href="/replay?id=${s.id}">Replay</a></div>`))
  }
  el.querySelector("#new").onclick = async (ev) => {
    ev.target.disabled = true
    el.querySelector("#msg").textContent = "Starting a container..."
    const m = await api("/api/sessions", { method: "POST" })
    if (m.status !== "running") { el.querySelector("#msg").textContent = `Failed: ${m.error ?? m.status}`; ev.target.disabled = false; return }
    location.href = `/?id=${m.id}`
  }
}

async function workspace() {
  const meta = await api(`/api/sessions/${id}`)
  if (meta.status !== "running") {
    root.replaceChildren($(`<div class="list"><h1>Session ${esc(id)}</h1><p class="muted">This session is ${esc(meta.status)}.</p>
      <p><button id="resume">Resume in a new container</button> <a href="/replay?id=${esc(id)}">Replay</a> · <a href="/">All sessions</a></p></div>`))
    root.querySelector("#resume").onclick = async () => { await api(`/api/sessions/${id}/resume`, { method: "POST" }); location.reload() }
    return
  }
  root.replaceChildren($(`<div class="app">
    <header>
      <a href="/" class="muted">Sessions</a><span class="muted">/</span><span class="title mono">${esc(id)}</span>
      <span class="muted mono" id="clock"></span><span class="grow"></span>
      <a href="/replay?id=${esc(id)}" target="_blank">Replay</a>
      <button class="primary" id="end">Submit and end</button>
    </header>
    <div class="cols">
      <div class="col"><div class="files" id="files"></div></div>
      <div class="col" style="background:#000"><div id="term"></div></div>
      <div class="col">
        <div class="tabs"><button class="on" data-tab="timeline">Timeline</button><button data-tab="file">File</button></div>
        <div class="pane" id="pane"></div>
      </div>
    </div>
  </div>`))

  const started = new Date(meta.createdAt)
  setInterval(() => {
    const s = Math.floor((Date.now() - started) / 1000)
    document.getElementById("clock").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`
  }, 1000)

  // Terminal
  const term = new Terminal({ fontFamily: "ui-monospace, Menlo, monospace", fontSize: 13, cursorBlink: true, theme: { background: "#000000" } })
  const fit = new FitAddon.FitAddon()
  term.loadAddon(fit)
  term.open(document.getElementById("term"))
  fit.fit()
  let ws
  const connect = () => {
    ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/s/${id}/pty`)
    ws.onopen = () => ws.send(JSON.stringify({ t: "r", c: term.cols, r: term.rows }))
    ws.onmessage = (m) => term.write(m.data)
    ws.onclose = () => { term.write("\r\n[disconnected, retrying]\r\n"); setTimeout(connect, 1500) }
  }
  connect()
  term.onData((d) => ws?.readyState === 1 && ws.send(JSON.stringify({ t: "i", d })))
  new ResizeObserver(() => { fit.fit(); ws?.readyState === 1 && ws.send(JSON.stringify({ t: "r", c: term.cols, r: term.rows })) }).observe(document.getElementById("term"))
  term.focus()

  // Files
  let current = null
  const loadFiles = async () => {
    const { files = [] } = await api(`/s/${id}/agent/files`)
    const box = document.getElementById("files")
    box.replaceChildren(...files.map((f) => f.dir
      ? $(`<div class="d mono">${esc(f.path)}/</div>`)
      : (() => { const b = $(`<button class="f mono${f.path === current ? " on" : ""}" title="${esc(f.path)}">${esc(f.path.split("/").pop())}</button>`); b.style.paddingLeft = `${12 + (f.path.split("/").length - 1) * 12}px`; b.onclick = () => openFile(f.path); return b })()))
  }
  setInterval(loadFiles, 3000)
  loadFiles()

  // Right pane
  let tab = "timeline"
  const pane = document.getElementById("pane")
  const tabs = [...document.querySelectorAll(".tabs button")]
  const setTab = (t) => { tab = t; tabs.forEach((b) => b.classList.toggle("on", b.dataset.tab === t)); t === "timeline" ? renderTimeline() : renderFile() }
  tabs.forEach((b) => (b.onclick = () => setTab(b.dataset.tab)))

  let events = []
  const renderTimeline = () => {
    if (tab !== "timeline") return
    const shown = events.map((e) => [e, describe(e)]).filter(([, d]) => d)
    if (!shown.length) return pane.replaceChildren($(`<div class="empty">Nothing yet. Type <span class="mono">claude</span> in the terminal to start.</div>`))
    pane.replaceChildren(...shown.slice().reverse().map(([e, [k, t]]) => $(`<div class="ev ${e.type.replace(".", "-")} ${e.type}"><div class="k">#${e.seq} · ${new Date(e.ts).toLocaleTimeString()} · ${esc(k)}</div>${t ? `<div class="t">${esc(t).slice(0, 1200)}</div>` : ""}</div>`)))
  }
  const poll = async () => { events = await api(`/api/sessions/${id}/events`); renderTimeline() }
  setInterval(poll, 1500)
  poll()

  let fileText = ""
  async function openFile(p) {
    current = p
    const r = await api(`/s/${id}/agent/file?path=${encodeURIComponent(p)}`)
    fileText = r.content ?? r.error ?? ""
    setTab("file")
    loadFiles()
  }
  function renderFile() {
    if (!current) return pane.replaceChildren($(`<div class="empty">Pick a file on the left.</div>`))
    const ed = $(`<div class="editor"><div class="bar"><span class="mono grow" style="flex:1">${esc(current)}</span><span class="muted" id="saved"></span><button id="save">Save</button></div><textarea spellcheck="false"></textarea></div>`)
    const ta = ed.querySelector("textarea")
    ta.value = fileText
    ed.querySelector("#save").onclick = async () => {
      await fetch(`/s/${id}/agent/file?path=${encodeURIComponent(current)}`, { method: "PUT", body: ta.value })
      fileText = ta.value
      ed.querySelector("#saved").textContent = "Saved, recorded as your edit"
    }
    pane.replaceChildren(ed)
  }

  // Two clicks, not a browser dialog: the container is removed; the code and recording stay.
  const end = document.getElementById("end")
  end.onclick = async () => {
    if (end.dataset.armed !== "1") { end.dataset.armed = "1"; end.textContent = "Click again to submit"; setTimeout(() => { end.dataset.armed = ""; end.textContent = "Submit and end" }, 4000); return }
    end.disabled = true
    end.textContent = "Submitting..."
    await api(`/api/sessions/${id}/end`, { method: "POST" })
    location.href = `/replay?id=${id}`
  }
}

id ? workspace() : listPage()
</script>
</body>
</html>
